name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble release APK
        run: gradle :app:assembleDebug
      - name: Publish or update permanent Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
            gh release edit latest --title "MAYA Latest" --notes "Latest successful MAYA Android APK. Updated automatically from main." --latest
          else
            gh release create latest app/build/outputs/apk/debug/app-debug.apk --title "MAYA Latest" --notes "Latest successful MAYA Android APK. Updated automatically from main." --target "$GITHUB_SHA" --latest
          fi
